<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Horários 2026.2</title>
<style>
:root {
  --ifpa-green:#19733b;
  --ifpa-green-dark:#0f4f29;
  --ifpa-red:#b3262d;
  --bg:#f4f7f5;
  --text:#26312b;
  --muted:#69756e;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif}
header{
  background:linear-gradient(135deg,var(--ifpa-green-dark),var(--ifpa-green));
  border-top:6px solid var(--ifpa-red);color:#fff;padding:18px 26px
}
header h1{margin:0 0 4px;font-size:25px}
header p{margin:0;color:rgba(255,255,255,.85)}
main{max-width:1900px;margin:auto;padding:18px}
.toolbar,.panel,.class-sidebar{
  background:#fff;border:0;border-radius:.75rem;
  box-shadow:0 .125rem .45rem rgba(0,0,0,.07)
}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 14px;margin-bottom:12px}
button{
  min-height:38px;border:1px solid #ced4da;border-radius:.375rem;
  background:#fff;padding:0 14px;font-size:14px;color:#27312b;
  cursor:pointer;font-weight:700
}
button.active{background:var(--ifpa-green);border-color:var(--ifpa-green);color:#fff}
.view-buttons{display:flex;gap:8px}
.shift-indicator{
  margin-left:auto;display:inline-flex;align-items:center;min-height:38px;padding:0 14px;
  border-radius:.375rem;background:#e7f3ea;color:var(--ifpa-green-dark);
  font-size:13px;font-weight:700;white-space:nowrap
}
.workspace{display:grid;grid-template-columns:275px minmax(0,1fr);gap:14px;align-items:start}
.class-sidebar{
  position:sticky;top:12px;display:flex;flex-direction:column;
  max-height:calc(100vh - 24px);overflow:hidden
}
.sidebar-head{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:14px;color:#fff;background:linear-gradient(135deg,var(--ifpa-green-dark),var(--ifpa-green))
}
.sidebar-head strong{display:block;font-size:16px}
.sidebar-head span{display:block;margin-top:2px;font-size:11px;color:rgba(255,255,255,.8)}
.sidebar-close{display:none;min-height:32px;width:32px;padding:0;border:0;color:#fff;background:rgba(255,255,255,.14);font-size:24px}
.sidebar-list{display:flex;flex-direction:column;gap:3px;padding:8px;overflow:auto}
.course-group{display:flex;flex-direction:column;gap:3px;margin-bottom:8px}
.course-group:last-child{margin-bottom:0}
.course-group-title{
  margin:3px 2px 1px;padding:6px 9px;border-radius:.45rem;
  font-size:11px;font-weight:800;letter-spacing:.035em;text-transform:uppercase
}
.sidebar-item{
  width:100%;min-height:0;padding:10px 11px;border:0;border-radius:.45rem;
  background:transparent;color:#334039;text-align:left;font-weight:600;line-height:1.2
}
.sidebar-item small{display:block;font-size:11px;color:#6b766f;font-weight:500;margin-top:3px}

/* Informática — azul frio e suave */
.course-info .course-group-title{background:#e7f0f6;color:#42677d}
.sidebar-item.course-info{background:#f7fafc}
.sidebar-item.course-info:hover{background:#edf4f8}
.sidebar-item.course-info.active{color:#345c73;background:#e2eef5;box-shadow:inset 3px 0 0 #6f9db8}

/* Edificações — verde frio e suave */
.course-edif .course-group-title{background:#e6f0eb;color:#476c59}
.sidebar-item.course-edif{background:#f7faf8}
.sidebar-item.course-edif:hover{background:#edf5f0}
.sidebar-item.course-edif.active{color:#3f6752;background:#e1eee7;box-shadow:inset 3px 0 0 #78a28c}

/* Agropecuária — amarelo acinzentado e discreto */
.course-agro .course-group-title{background:#f3f0df;color:#756d43}
.sidebar-item.course-agro{background:#fcfbf6}
.sidebar-item.course-agro:hover{background:#f6f3e7}
.sidebar-item.course-agro.active{color:#6c633d;background:#efecd9;box-shadow:inset 3px 0 0 #b6aa6a}

/* Administração — vermelho frio e suave */
.course-adm .course-group-title{background:#f3e8e9;color:#7b5459}
.sidebar-item.course-adm{background:#fcf8f8}
.sidebar-item.course-adm:hover{background:#f7eeee}
.sidebar-item.course-adm.active{color:#744c52;background:#f1e3e5;box-shadow:inset 3px 0 0 #b68289}

/* Visualização por docente */
.sidebar-item.teacher-item:hover{background:#eef5f0}
.sidebar-item.teacher-item.active{
  color:var(--ifpa-green-dark);background:#dfeee3;
  box-shadow:inset 3px 0 0 var(--ifpa-green)
}
.calendar-content{min-width:0}
.ead-block{
  margin-top:14px;
  padding:15px 16px;
  background:#fff;
  border:1px solid #e5ebe7;
  border-radius:.75rem;
  box-shadow:0 1px 4px rgba(0,0,0,.05)
}
.ead-block h3{
  margin:0;
  font-size:14px;
  color:var(--ifpa-green-dark)
}
.ead-block ul{
  margin:9px 0 0;
  padding-left:20px
}
.ead-block li{
  margin:4px 0;
  font-size:13px
}
.ead-block.hidden{display:none}
.panel{overflow:hidden}
.panel-head{padding:12px 15px;border-bottom:1px solid #edf0ee}
.panel-head h2{font-size:17px;margin:0}
.table-wrap{overflow:auto}
table{width:100%;min-width:1100px;border-collapse:separate;border-spacing:0}
th{background:#f7f9f8;padding:8px 6px;font-size:12px;text-align:center;border-bottom:1px solid #e9edeb;position:sticky;top:0;z-index:2}
th:first-child{left:0;z-index:4}
td{border-bottom:1px solid #eff2f0;vertical-align:top}
td.time{
  position:sticky;left:0;z-index:1;background:#fff;width:112px;min-width:112px;
  text-align:center;padding:5px;font-size:11px;font-weight:700;border-right:1px solid #edf0ee
}
td.slot{height:79px;padding:4px}
.lesson{
  min-height:70px;height:100%;border:0;border-radius:.55rem;padding:7px 8px;
  box-shadow:0 1px 3px rgba(0,0,0,.07);display:flex;flex-direction:column;justify-content:center
}
.subject{font-size:11.5px;font-weight:800;line-height:1.12}
.teacher{font-size:10.5px;font-weight:650;margin-top:4px;color:#34453c}
.meta{font-size:9.2px;margin-top:3px;color:#66736c}
.empty{height:100%;display:flex;align-items:center;justify-content:center;color:#b5bdb8;font-size:10px}
.shift-row td{
  position:static!important;background:#e8f0ea!important;color:var(--ifpa-green-dark);
  padding:6px 9px!important;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em
}
.interval td{
  position:static!important;background:#f7f8f7!important;text-align:center!important;color:#7b837e;
  padding:4px!important;font-size:10px;font-weight:700
}
.hidden{display:none!important}
.conflict-alert{
  margin:0 0 12px;padding:10px 13px;border-radius:.5rem;background:#fff3cd;
  color:#664d03;box-shadow:0 .125rem .35rem rgba(0,0,0,.05);font-size:13px;line-height:1.35
}
.note{font-size:11px;color:var(--muted);margin-top:8px}
.sidebar-toggle{display:none}
.sidebar-overlay{display:none}
.visually-hidden{
  position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;
  overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important
}
@media(max-width:1000px){
  .workspace{display:block}
  .sidebar-toggle{display:inline-flex;align-items:center;justify-content:center}
  .class-sidebar{
    position:fixed;z-index:1200;top:0;left:0;width:min(320px,86vw);height:100vh;max-height:none;
    border-radius:0 .75rem .75rem 0;transform:translateX(-105%);transition:transform .22s ease
  }
  .class-sidebar.open{transform:translateX(0)}
  .sidebar-close{display:inline-flex;align-items:center;justify-content:center}
  .sidebar-overlay{position:fixed;z-index:1190;inset:0;background:rgba(0,0,0,.28)}
  .sidebar-overlay.open{display:block}
  .shift-indicator{margin-left:0}
}

.teacher-locator-trigger{
  border-color:var(--ifpa-green);
  color:var(--ifpa-green-dark)
}
.teacher-locator-trigger:hover{
  background:#edf6ef
}
.teacher-locator-modal{
  position:fixed;
  inset:0;
  z-index:1000;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:rgba(20,32,25,.58)
}
.teacher-locator-modal.hidden{display:none}
.teacher-locator-card{
  width:min(680px,100%);
  max-height:calc(100vh - 36px);
  overflow:auto;
  background:#fff;
  border-radius:1rem;
  box-shadow:0 1.25rem 3rem rgba(0,0,0,.25)
}
.teacher-locator-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:16px;
  padding:20px 22px 12px;
  border-bottom:1px solid #e8ece9
}
.teacher-locator-head h2{
  margin:0;
  color:var(--ifpa-green-dark);
  font-size:21px
}
.teacher-locator-head p{
  margin:5px 0 0;
  color:#637068;
  font-size:13px;
  line-height:1.45
}
.teacher-locator-close{
  flex:0 0 auto;
  min-height:34px;
  width:34px;
  padding:0;
  border:0;
  border-radius:50%;
  background:#eef2ef;
  color:#445149;
  font-size:23px;
  line-height:1
}
.teacher-locator-body{
  padding:18px 22px 22px
}
.teacher-locator-label{
  display:block;
  margin-bottom:7px;
  color:#354039;
  font-size:13px;
  font-weight:800
}
.teacher-locator-search{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:9px
}
.teacher-locator-search input{
  min-width:0;
  min-height:42px;
  border:1px solid #bdc8c1;
  border-radius:.5rem;
  padding:0 12px;
  font:inherit;
  color:#26312b;
  background:#fff
}
.teacher-locator-search input:focus{
  outline:3px solid rgba(40,126,72,.16);
  border-color:var(--ifpa-green)
}
.teacher-locator-clock{
  margin-top:12px;
  padding:10px 12px;
  border-radius:.55rem;
  background:#f4f7f5;
  color:#526058;
  font-size:13px
}
.teacher-locator-result{
  margin-top:14px
}
.teacher-location-state{
  padding:14px 15px;
  border:1px solid #dce5df;
  border-radius:.7rem;
  background:#fbfcfb
}
.teacher-location-state.current{
  border-color:#a9cfb5;
  background:#edf7f0
}
.teacher-location-state.next{
  border-color:#b7cbd7;
  background:#f0f6f9
}
.teacher-location-state.warning{
  border-color:#dfca8d;
  background:#fff9e8
}
.teacher-location-state h3{
  margin:0 0 8px;
  font-size:16px;
  color:#284232
}
.teacher-location-state p{
  margin:4px 0;
  line-height:1.5;
  color:#3f4b44
}
.teacher-location-state strong{
  color:#26342c
}
.teacher-location-status{
  display:inline-block;
  margin-bottom:9px;
  padding:4px 8px;
  border-radius:999px;
  background:#dceee1;
  color:#1f6235;
  font-size:11px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.04em
}
.teacher-location-state.next .teacher-location-status{
  background:#dceaf1;
  color:#2a6178
}
.teacher-location-state.warning .teacher-location-status{
  background:#f3e5b8;
  color:#765b0d
}
.teacher-location-muted{
  color:#6b7770;
  font-size:12px
}
@media(max-width:620px){
  .teacher-locator-search{grid-template-columns:1fr}
  .teacher-locator-search button{width:100%}
  .teacher-locator-head,.teacher-locator-body{padding-left:16px;padding-right:16px}
}

@media print{
  header{background:#fff;color:#000;border-top:0;border-bottom:1px solid #bbb;padding:10px 0}
  header p{color:#555}
  .toolbar,.class-sidebar,.sidebar-overlay,.note,.conflict-alert,.teacher-locator-modal{display:none!important}
  main{padding:0}
  .workspace{display:block}
  .panel{box-shadow:none;border-radius:0}
}
</style>
</head>
<body>
<header>
  <h1>Painel de Horários 2026.2</h1>
  <p>IFPA Campus Altamira</p>
</header>

<main>
  <section class="toolbar">
    <button id="sidebarToggle" class="sidebar-toggle">☰ Menu</button>
    <div class="view-buttons">
      <button id="classViewBtn" class="active">Por Turma</button>
      <button id="teacherViewBtn">Por Docente</button>
      <button id="roomViewBtn">Agenda de Salas</button>
    </div>
    <button id="teacherLocatorBtn" class="teacher-locator-trigger">Onde está o Docente?</button>
    <button type="button" disabled aria-disabled="true" title="Impressão desativada">Imprimir Calendário</button>
    <span class="shift-indicator" id="topShiftBadge">Turno Principal: Manhã</span>
  </section>

  <div id="conflictAlert" class="conflict-alert hidden"></div>

  <div class="workspace">
    <aside id="sidebar" class="class-sidebar">
      <div class="sidebar-head">
        <div>
          <strong id="sidebarTitle">Turmas</strong>
          <span id="sidebarSubtitle">Selecione uma grade</span>
        </div>
        <button id="sidebarClose" class="sidebar-close">×</button>
      </div>
      <nav id="sidebarList" class="sidebar-list"></nav>
    </aside>

    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <div class="calendar-content">
      <section class="panel">
        <div class="panel-head"><h2 id="panelTitle"></h2></div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Horário</th>
                <th>Segunda</th>
                <th>Terça</th>
                <th>Quarta</th>
                <th>Quinta</th>
                <th>Sexta</th>
              </tr>
            </thead>
            <tbody id="scheduleBody"></tbody>
          </table>
        </div>
      </section>
      <section id="eadBlock" class="ead-block hidden">
        <h3>Disciplinas Ministradas em EAD:</h3>
        <ul id="eadList"></ul>
      </section>
      <p class="note"></p>
    </div>
  </div>
</main>


<div id="teacherLocatorModal" class="teacher-locator-modal hidden"
     role="dialog" aria-modal="true" aria-labelledby="teacherLocatorTitle">
  <section class="teacher-locator-card">
    <div class="teacher-locator-head">
      <div>
        <h2 id="teacherLocatorTitle">Onde está o Docente?</h2>
        <p>Localiza a aula atual ou a próxima aula prevista usando a data e o horário do dispositivo.</p>
      </div>
      <button id="teacherLocatorClose" class="teacher-locator-close"
              type="button" aria-label="Fechar">×</button>
    </div>
    <div class="teacher-locator-body">
      <label class="teacher-locator-label" for="teacherLocatorInput">Nome do docente</label>
      <div class="teacher-locator-search">
        <input id="teacherLocatorInput" type="text"
               list="teacherLocatorList"
               autocomplete="off"
               placeholder="Digite ou selecione o nome do docente">
        <datalist id="teacherLocatorList"></datalist>
        <button id="teacherLocatorSearchBtn" type="button">Consultar</button>
      </div>
      <div id="teacherLocatorClock" class="teacher-locator-clock"></div>
      <div id="teacherLocatorResult" class="teacher-locator-result"
           aria-live="polite"></div>
    </div>
  </section>
</div>

let currentView = "class";
let selectedClass = Object.keys(classes)[0];
let selectedTeacher = teacherNames[0];
let selectedRoom = allRooms[0] || "Sala 01";

function openSidebar() {
  sidebar.classList.add("open");
  sidebarOverlay.classList.add("open");
}
function closeSidebar() {
  sidebar.classList.remove("open");
  sidebarOverlay.classList.remove("open");
}
sidebarToggle.onclick = openSidebar;
sidebarClose.onclick = closeSidebar;
sidebarOverlay.onclick = closeSidebar;

const jsDayByName = {
  "Segunda": 1,
  "Terça": 2,
  "Quarta": 3,
  "Quinta": 4,
  "Sexta": 5
};

teacherLocatorList.innerHTML = teacherNames
  .map(name => `<option value="${name.replace(/"/g, "&quot;")}"></option>`)
  .join("");

function normalizeTeacherName(value) {
  return value
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLocaleLowerCase("pt-BR")
    .trim();
}

function resolveTeacherName(value) {
  const normalized = normalizeTeacherName(value);
  if (!normalized) return null;

  const exact = teacherNames.find(
    name => normalizeTeacherName(name) === normalized
  );
  if (exact) return exact;

  const startsWith = teacherNames.filter(
    name => normalizeTeacherName(name).startsWith(normalized)
  );
  if (startsWith.length === 1) return startsWith[0];

  const contains = teacherNames.filter(
    name => normalizeTeacherName(name).includes(normalized)
  );
  return contains.length === 1 ? contains[0] : null;
}

function parseClockMinutes(clock) {
  const [hour, minute] = clock.split(":").map(Number);
  return hour * 60 + minute;
}

function periodBounds(periodCode) {
  const period = periods.find(item => item.code === periodCode);
  const [start, end] = period.time.split("–");
  return {
    start: parseClockMinutes(start),
    end: parseClockMinutes(end)
  };
}

function formatSystemDateTime(date) {
  return new Intl.DateTimeFormat("pt-BR", {
    weekday: "long",
    day: "2-digit",
    month: "long",
    year: "numeric",
    hour: "2-digit",
    minute: "2-digit"
  }).format(date);
}

function formatNextLessonDate(date) {
  return new Intl.DateTimeFormat("pt-BR", {
    weekday: "long",
    day: "2-digit",
    month: "2-digit",
    hour: "2-digit",
    minute: "2-digit"
  }).format(date);
}

function formatWaitTime(milliseconds) {
  const totalMinutes = Math.max(0, Math.round(milliseconds / 60000));
  const days = Math.floor(totalMinutes / 1440);
  const hours = Math.floor((totalMinutes % 1440) / 60);
  const minutes = totalMinutes % 60;
  const parts = [];

  if (days) parts.push(`${days} dia${days === 1 ? "" : "s"}`);
  if (hours) parts.push(`${hours} hora${hours === 1 ? "" : "s"}`);
  if (minutes || !parts.length) {
    parts.push(`${minutes} minuto${minutes === 1 ? "" : "s"}`);
  }

  return parts.join(" e ");
}

function lessonStartDate(reference, lesson) {
  const targetDay = jsDayByName[lesson.day];
  const bounds = periodBounds(lesson.period);
  let dayOffset = (targetDay - reference.getDay() + 7) % 7;

  const result = new Date(reference);
  result.setHours(Math.floor(bounds.start / 60), bounds.start % 60, 0, 0);
  result.setDate(reference.getDate() + dayOffset);

  if (dayOffset === 0 && result <= reference) {
    result.setDate(result.getDate() + 7);
  }

  return result;
}

function currentLessonForTeacher(teacher, now) {
  const dayName = Object.entries(jsDayByName)
    .find(([,dayNumber]) => dayNumber === now.getDay())?.[0];

  if (!dayName) return null;

  const currentMinutes = now.getHours() * 60 + now.getMinutes();

  return allLessons.find(lesson => {
    if (lesson.teacher !== teacher || lesson.day !== dayName) return false;
    const bounds = periodBounds(lesson.period);
    return currentMinutes >= bounds.start && currentMinutes < bounds.end;
  }) || null;
}

function nextLessonForTeacher(teacher, now) {
  return allLessons
    .filter(lesson => lesson.teacher === teacher)
    .map(lesson => ({
      lesson,
      startsAt: lessonStartDate(now, lesson)
    }))
    .sort((a,b) => a.startsAt - b.startsAt)[0] || null;
}

function updateTeacherLocatorClock() {
  teacherLocatorClock.textContent =
    `Horário do sistema: ${formatSystemDateTime(new Date())}`;
}

function showTeacherLocatorMessage(html, stateClass="warning") {
  teacherLocatorResult.innerHTML =
    `<div class="teacher-location-state ${stateClass}">${html}</div>`;
}

function locateTeacher() {
  updateTeacherLocatorClock();

  const teacher = resolveTeacherName(teacherLocatorInput.value);

  if (!teacher) {
    showTeacherLocatorMessage(
      `<span class="teacher-location-status">Atenção</span>
       <h3>Docente não identificado</h3>
       <p>Digite ou selecione um nome completo na lista de docentes.</p>`
    );
    return;
  }

  teacherLocatorInput.value = teacher;
  const now = new Date();
  const currentLesson = currentLessonForTeacher(teacher, now);

  if (currentLesson) {
    showTeacherLocatorMessage(
      `<span class="teacher-location-status">Em aula agora</span>
       <h3>${teacher}</h3>
       <p><strong>Turma:</strong> ${currentLesson.className}</p>
       <p><strong>Componente:</strong> ${currentLesson.subject}</p>
       <p><strong>Local:</strong> ${currentLesson.room}</p>
       <p><strong>Horário:</strong> ${currentLesson.day}, ${currentLesson.period}
       (${currentLesson.time})</p>`,
      "current"
    );
    return;
  }

  const next = nextLessonForTeacher(teacher, now);

  if (!next) {
    showTeacherLocatorMessage(
      `<span class="teacher-location-status">Sem aulas</span>
       <h3>${teacher}</h3>
       <p>Não há aulas cadastradas para este docente no calendário.</p>`
    );
    return;
  }

  showTeacherLocatorMessage(
    `<span class="teacher-location-status">Próxima aula</span>
     <h3>${teacher} não está em aula neste momento</h3>
     <p><strong>Próxima Turma:</strong> ${next.lesson.className}</p>
     <p><strong>Componente:</strong> ${next.lesson.subject}</p>
     <p><strong>Local:</strong> ${next.lesson.room}</p>
     <p><strong>Quando:</strong> ${formatNextLessonDate(next.startsAt)},
     ${next.lesson.period} (${next.lesson.time})</p>
     <p class="teacher-location-muted">Início previsto em
     ${formatWaitTime(next.startsAt - now)}.</p>`,
    "next"
  );
}

function openTeacherLocator() {
  teacherLocatorModal.classList.remove("hidden");
  updateTeacherLocatorClock();

  if (currentView === "teacher" && selectedTeacher) {
    teacherLocatorInput.value = selectedTeacher;
    locateTeacher();
  } else {
    teacherLocatorInput.value = "";
    teacherLocatorResult.innerHTML = "";
  }

  setTimeout(() => teacherLocatorInput.focus(), 0);
}

function closeTeacherLocator() {
  teacherLocatorModal.classList.add("hidden");
}

teacherLocatorBtn.onclick = openTeacherLocator;
teacherLocatorClose.onclick = closeTeacherLocator;
teacherLocatorSearchBtn.onclick = locateTeacher;

teacherLocatorInput.addEventListener("keydown", event => {
  if (event.key === "Enter") locateTeacher();
});

teacherLocatorInput.addEventListener("input", () => {
  const teacher = resolveTeacherName(teacherLocatorInput.value);
  if (teacher && normalizeTeacherName(teacher) === normalizeTeacherName(teacherLocatorInput.value)) {
    locateTeacher();
  }
});

teacherLocatorModal.addEventListener("click", event => {
  if (event.target === teacherLocatorModal) closeTeacherLocator();
});

document.addEventListener("keydown", event => {
  if (event.key === "Escape" && !teacherLocatorModal.classList.contains("hidden")) {
    closeTeacherLocator();
  }
});

setInterval(() => {
  if (!teacherLocatorModal.classList.contains("hidden")) {
    updateTeacherLocatorClock();
    if (resolveTeacherName(teacherLocatorInput.value)) locateTeacher();
  }
}, 30000);

function lessonBox(item) {
  if (!item) return '<div class="empty">Livre</div>';
  const bg = subjectColors[item.subject] || "#dce7ef";

  if (currentView === "room") {
    return `<div class="lesson" style="background:${bg}">
      <div class="subject">${item.subject}</div>
      <div class="teacher">${item.className}</div>
      <div class="meta">${item.teacher}</div>
    </div>`;
  }

  const secondaryLine = currentView === "teacher" ? item.className : item.teacher;
  return `<div class="lesson" style="background:${bg}">
    <div class="subject">${item.subject}</div>
    <div class="teacher">${secondaryLine}</div>
    <div class="meta">Local: ${item.room}</div>
  </div>`;
}

function renderSidebar() {
  sidebarList.innerHTML = "";

  if (currentView === "class") {
    sidebarTitle.textContent = "Turmas";
    sidebarSubtitle.textContent = "Selecione uma grade";

    const courseGroups = [
      {name: "Informática", match: "Informática", className: "course-info"},
      {name: "Edificações", match: "Edificações", className: "course-edif"},
      {name: "Agropecuária", match: "Agropecuária", className: "course-agro"},
      {name: "Administração", match: "Administração", className: "course-adm"}
    ];

    courseGroups.forEach(group => {
      const entries = Object.entries(classes).filter(([,data]) =>
        data.course.includes(group.match)
      );

      if (!entries.length) return;

      const section = document.createElement("div");
      section.className = `course-group ${group.className}`;

      const title = document.createElement("div");
      title.className = "course-group-title";
      title.textContent = group.name;
      section.appendChild(title);

      entries.forEach(([key,data]) => {
        const b = document.createElement("button");
        b.className = `sidebar-item ${group.className}` + (key === selectedClass ? " active" : "");
        b.innerHTML = `${data.short} — ${data.name.includes("2026") ? "Turma 2026" : data.name.includes("2025") ? "Turma 2025" : "Turma 2024"}
          <small>Turno principal: ${data.main_shift}</small>`;
        b.onclick = () => {
          selectedClass = key;
          renderAll();
          closeSidebar();
        };
        section.appendChild(b);
      });

      sidebarList.appendChild(section);
    });
  } else if (currentView === "teacher") {
    sidebarTitle.textContent = "Docentes";
    sidebarSubtitle.textContent = "Selecione um docente";

    [...new Set(allLessons.map(x => x.teacher))]
      .sort((a,b) => a.localeCompare(b, "pt-BR"))
      .forEach(name => {
        const b = document.createElement("button");
        b.className = "sidebar-item teacher-item" + (name === selectedTeacher ? " active" : "");
        b.textContent = name;
        b.onclick = () => {
          selectedTeacher = name;
          renderAll();
          closeSidebar();
        };
        sidebarList.appendChild(b);
      });
  } else {
    sidebarTitle.textContent = "Salas";
    sidebarSubtitle.textContent = "Selecione uma sala";

    allRooms.forEach(room => {
      const b = document.createElement("button");
      b.className = "sidebar-item teacher-item" + (room === selectedRoom ? " active" : "");
      b.textContent = room;
      b.onclick = () => {
        selectedRoom = room;
        renderAll();
        closeSidebar();
      };
      sidebarList.appendChild(b);
    });
  }
}

function renderTable(lessons, mainShift=null) {
  const body = document.getElementById("scheduleBody");
  body.innerHTML = "";
  let lastShift = null;

  for (const p of periods) {
    if (p.shift !== lastShift) {
      const tr = document.createElement("tr");
      tr.className = "shift-row";
      let label = p.shift;
      if (currentView === "class" && mainShift) {
        label = p.shift === mainShift ? `Turno principal — ${p.shift}` : `Contraturno — ${p.shift}`;
      }
      tr.innerHTML = `<td colspan="6">${label}</td>`;
      body.appendChild(tr);
      lastShift = p.shift;
    }

    if (p.code === "M4" || p.code === "T4") {
      const tr = document.createElement("tr");
      tr.className = "interval";
      tr.innerHTML = '<td colspan="6">INTERVALO</td>';
      body.appendChild(tr);
    }

    const tr = document.createElement("tr");
    tr.innerHTML = `<td class="time">${p.code}<br>${p.time}</td>` +
      days.map(day => {
        const items = lessons.filter(l => l.day === day && l.period === p.code);
        const content = items.length ? items.map(lessonBox).join("") : lessonBox(null);
        return `<td class="slot">${content}</td>`;
      }).join("");
    body.appendChild(tr);
  }
}

function updateConflictAlert() {
  const grouped = new Map();
  const byTeacherDay = new Map();

  for (const lesson of allLessons) {
    const conflictKey = `${lesson.teacher}|${lesson.day}|${lesson.period}`;
    if (!grouped.has(conflictKey)) grouped.set(conflictKey, []);
    grouped.get(conflictKey).push(lesson);

    const dayKey = `${lesson.teacher}|${lesson.day}`;
    if (!byTeacherDay.has(dayKey)) byTeacherDay.set(dayKey, []);
    byTeacherDay.get(dayKey).push(lesson);
  }

  const conflicts = [...grouped.entries()].filter(([,items]) => items.length > 1);
  const lunchViolations = [];

  for (const [key, items] of byTeacherDay.entries()) {
    const [teacher, day] = key.split("|");
    const mornings = items
      .filter(x => x.period.startsWith("M"))
      .map(x => Number(x.period.substring(1)));
    const afternoons = items
      .filter(x => x.period.startsWith("T"))
      .map(x => Number(x.period.substring(1)));

    if (!mornings.length || !afternoons.length) continue;

    const lastMorning = Math.max(...mornings);
    const firstAfternoon = Math.min(...afternoons);
    const freePeriods = (6 - lastMorning) + (firstAfternoon - 1);

    if (freePeriods < 2) {
      lunchViolations.push({teacher, day, lastMorning, firstAfternoon});
    }
  }

  const alert = document.getElementById("conflictAlert");
  const sections = [];

  if (conflicts.length) {
    sections.push(
      "<strong>Conflito de horário docente identificado.</strong><br>" +
      conflicts.map(([key,items]) => {
        const [teacher,day,period] = key.split("|");
        const p = periods.find(x => x.code === period);
        return `${teacher}: ${day}, ${period} (${p.time}) — ${items.map(x => x.className).join(" e ")}`;
      }).join("<br>")
    );
  }

  if (!sections.length) {
    alert.classList.add("hidden");
    alert.innerHTML = "";
    return;
  }

  alert.innerHTML = sections.join("<br><br>");
  alert.classList.remove("hidden");
}

function renderAll() {
  renderSidebar();

  if (currentView === "class") {
    const data = classes[selectedClass];
    document.getElementById("panelTitle").textContent = data.name;
    document.getElementById("topShiftBadge").textContent = `Turno Principal: ${data.main_shift}`;

    const eadBlock = document.getElementById("eadBlock");
    const eadList = document.getElementById("eadList");
    const eadSubjects = eadSubjectsByClass[selectedClass] || [];
    eadList.innerHTML = eadSubjects.map(subject => `<li>${subject}</li>`).join("");
    eadBlock.classList.toggle("hidden", eadSubjects.length === 0);

    renderTable(data.schedule, data.main_shift);
    return;
  }

  document.getElementById("eadBlock").classList.add("hidden");

  if (currentView === "teacher") {
    const lessons = allLessons.filter(x => x.teacher === selectedTeacher);
    document.getElementById("panelTitle").textContent = selectedTeacher;
    document.getElementById("topShiftBadge").textContent = "Turnos: Manhã e Tarde";
    renderTable(lessons);
    return;
  }

  const lessons = allLessons.filter(x => x.room === selectedRoom);
  document.getElementById("panelTitle").textContent = `Agenda de Salas — ${selectedRoom}`;
  document.getElementById("topShiftBadge").textContent = selectedRoom;
  renderTable(lessons);
}

function setActiveViewButton(activeId) {
  ["classViewBtn", "teacherViewBtn", "roomViewBtn"].forEach(id => {
    document.getElementById(id).classList.toggle("active", id === activeId);
  });
}

document.getElementById("classViewBtn").onclick = () => {
  currentView = "class";
  setActiveViewButton("classViewBtn");
  renderAll();
};

document.getElementById("teacherViewBtn").onclick = () => {
  currentView = "teacher";
  setActiveViewButton("teacherViewBtn");
  renderAll();
};

roomViewBtn.onclick = () => {
  currentView = "room";
  setActiveViewButton("roomViewBtn");
  renderAll();
};

updateConflictAlert();
renderAll();
</script>
</body>
</html>
